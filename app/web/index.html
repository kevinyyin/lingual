<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Two-Way ASL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&family=Shantell+Sans:wght,BNCE,INFM@400..800,-100..100,0..100&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header id="topbar">
      <h1 class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="7" cy="23" r="2.8" fill="#F2592A"/><path d="M7 23C9 13 17 7 26 9M20.6 4.4 26 9l-6.7 1.9" fill="none" stroke="#F2592A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="word">Two-Way ASL</span> <span class="mode-name">Translator</span></h1>
      <span id="state" class="badge" role="status" aria-atomic="true" data-state="connecting">Connecting…</span>
      <button id="reclaim" type="button" class="btn" hidden onclick="location.reload()">Use it here</button>
      <button id="more" type="button" class="btn ghost icon-btn" aria-expanded="false" aria-controls="actions" aria-label="More">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M5 12h.01M12 12h.01M19 12h.01" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </button>
      <div id="actions" class="actions">
        <button id="calibrate" type="button" class="btn ghost" title="Rest your hands and keep a neutral face, then tap: the camera re-learns your resting pose">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Recalibrate
        </button>
        <a class="btn ghost" href="/teach.html">Teaching mode</a>
      </div>
    </header>
    <main id="app">
      <section id="avatar-panel" aria-label="Avatar signing what the hearing person says">
        <!-- the camera preview sits in the stage's corner on the phone (style.css), in the side column on a laptop -->
        <canvas id="avatar" aria-label="Signing avatar"></canvas>
        <div class="caption-box">
          <p id="caption" aria-live="polite"></p>
          <p id="plan" class="plan" role="group" aria-label="Signs in order"></p>
        </div>
      </section>
      <aside id="side">
        <figure class="card cam-card">
          <video id="cam" muted playsinline aria-label="Your camera"></video>
          <figcaption>Your camera · only hand and face points leave this device</figcaption>
        </figure>
        <div id="picker" class="card" role="group" aria-label="Which sign did you mean?" hidden></div>
        <section class="card said-card" aria-label="What the hearing person hears">
          <h2 class="card-title">Said aloud for the signer</h2>
          <p id="you-said" aria-live="polite"></p>
        </section>
        <form id="dev" class="card" hidden>
          <label for="dev-text" class="card-title">Type what the hearing person says</label>
          <div class="dev-row">
            <input id="dev-text" autocomplete="off" placeholder="e.g. Do you want coffee?" />
            <button type="submit" class="btn btn-primary">Send</button>
          </div>
        </form>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
