    <!--
    THESIS: ASL Dragon is drawn the way a sign moves: one line for the course, arrows for motion, a teacher's circle for a right answer. It refuses the candy path, ledge buttons and colored feedback sheets of gamified language apps.
    OWN-WORLD: cool paper #F6F7FB, indigo ink #232A63, periwinkle wash #E3E8FF, one green for motion and buttons #18943F, rose for a wrong answer; Comic Sans throughout (Comic Neue on phones); round 3-4px strokes, soft uneven corners, no ledges.
    STORY: a kid and a parent see what to learn next, watch the avatar sign with its hand's path drawn in, answer, and see the answer circled.
    FIRST VIEWPORT: a wash hero with "Next up: <lesson>" underlined in green, Continue, the avatar on the right; below, the unit heading and the course line ending in an arrowhead at the next lesson.
    FORM: motion lines (ASL dictionary notation), pinned by the user on 2026-10-23; no roll, no seed key.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="teach"></div>
    <script type="module" src="/src/teach/main.ts"></script>
  </body>
