# Single source of truth for the sign vocabulary (spec: ~150 general everyday signs).
# asl_citizen: the dataset's gloss string, verified against ASL Citizen splits/train.csv (variants WANT1/WANT2 match "WANT"); FIVE, TEN, HOW-MANY, FORGET and FOOD (= EAT) have no ASL Citizen class. Quote glosses: YAML reads bare YES/NO as booleans.
