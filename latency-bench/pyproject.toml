[project]
name = "latency-bench"
version = "0.1.0"
description = "Isolated latency benchmark harness for live speech-to-speech translation systems."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "websockets>=14.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.4",
    "silero-vad>=5.1",
    "faster-whisper>=1.1",
    "pydantic>=2.7",
    "typer>=0.12",
    "plotly>=5.22",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sacrebleu>=2.4",
    "audiotsm>=0.1.2",
]

[project.optional-dependencies]
hw = ["sounddevice>=0.4"]

[project.scripts]
bench = "bench.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
